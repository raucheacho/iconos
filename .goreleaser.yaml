version: 2

project_name: iconos

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

brews:
  - repository:
      owner: YOUR_GITHUB_USERNAME
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/YOUR_GITHUB_USERNAME/iconos"
    description: "CLI tool to generate icons and favicons from a source image"
    license: "MIT"
    install: |
      bin.install "iconos"
    test: |
      system "#{bin}/iconos", "--help"

scoops:
  - repository:
      owner: YOUR_GITHUB_USERNAME
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    homepage: "https://github.com/YOUR_GITHUB_USERNAME/iconos"
    description: "CLI tool to generate icons and favicons from a source image"
    license: "MIT"

release:
  github:
    owner: YOUR_GITHUB_USERNAME
    name: iconos
  draft: false
  prerelease: auto
